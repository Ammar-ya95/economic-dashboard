name: Refresh economic data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 11 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "economic-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/indicators.json
          git diff --cached --quiet || git commit -m "Daily economic data refresh"
          git push
